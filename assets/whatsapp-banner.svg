<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Banner do Guia de Prompt Engineering</title>
  <desc id="desc">Banner promocional em fundo preto e azul para divulgar um guia de bolso de prompt engineering.</desc>
  <defs>
    <radialGradient id="glow" cx="74%" cy="24%" r="58%">
      <stop offset="0%" stop-color="#1748e8" stop-opacity="0.55"/>
      <stop offset="48%" stop-color="#1748e8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10121a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#1748e8" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#000000"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08">
    <path d="M80 140H1520"/>
    <path d="M80 760H1520"/>
    <path d="M200 60V840"/>
    <path d="M1400 60V840"/>
  </g>
  <g transform="translate(92 92)">
    <rect x="0" y="0" width="202" height="58" rx="29" fill="#eceff5"/>
    <text x="28" y="38" font-family="'Encode Sans', Arial, sans-serif" font-size="22" font-weight="800" fill="#000000">NOVO GUIA</text>
  </g>
  <g transform="translate(92 230)">
    <text font-family="'Encode Sans', Arial, sans-serif" font-size="82" font-weight="300" fill="#d7d7df">
      <tspan x="0" y="0">Prompt Engineering</tspan>
      <tspan x="0" y="96">sem complicar</tspan>
    </text>
    <text x="0" y="230" font-family="'Encode Sans', Arial, sans-serif" font-size="34" font-weight="400" fill="#9ca0b4">
      <tspan x="0" dy="0">Templates prontos, exemplos preenchidos</tspan>
      <tspan x="0" dy="46">e campos marcados para substituir.</tspan>
    </text>
    <g transform="translate(0 342)">
      <rect width="422" height="64" rx="32" fill="#1748e8"/>
      <text x="32" y="42" font-family="'Encode Sans', Arial, sans-serif" font-size="24" font-weight="800" fill="#f7f7fb">Acesse o guia de bolso</text>
    </g>
  </g>
  <g transform="translate(900 172)" filter="url(#shadow)">
    <rect width="560" height="548" rx="36" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
    <g transform="translate(44 48)">
      <rect width="158" height="40" rx="20" fill="#1748e8"/>
      <text x="24" y="27" font-family="'Encode Sans', Arial, sans-serif" font-size="18" font-weight="800" fill="#f7f7fb">TEMPLATE</text>
      <text x="0" y="138" font-family="'Encode Sans', Arial, sans-serif" font-size="31" font-weight="700" fill="#f7f7fb">Você é [[PAPEL]]</text>
      <rect x="0" y="178" width="472" height="56" rx="28" fill="#1748e8" fill-opacity="0.16" stroke="#2f64ff" stroke-opacity="0.45"/>
      <text x="28" y="214" font-family="'Encode Sans', Arial, sans-serif" font-size="24" font-weight="600" fill="#d7d7df">[[AÇÃO_PRINCIPAL]]</text>
      <rect x="0" y="260" width="394" height="56" rx="28" fill="#ffffff" fill-opacity="0.06"/>
      <text x="28" y="296" font-family="'Encode Sans', Arial, sans-serif" font-size="24" font-weight="600" fill="#d7d7df">[[PÚBLICO]]</text>
      <rect x="0" y="342" width="438" height="56" rx="28" fill="#ffffff" fill-opacity="0.06"/>
      <text x="28" y="378" font-family="'Encode Sans', Arial, sans-serif" font-size="24" font-weight="600" fill="#d7d7df">[[FORMATO]]</text>
      <path d="M18 458H454" stroke="#2f64ff" stroke-width="4" stroke-linecap="round"/>
      <path d="M18 492H330" stroke="#ffffff" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <text x="92" y="820" font-family="'Encode Sans', Arial, sans-serif" font-size="24" font-weight="600" fill="#9ca0b4">fernandooliveiradev.github.io/promptengineering</text>
</svg>
